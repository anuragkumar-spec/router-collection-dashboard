name: Daily Dashboard Refresh

on:
  schedule:
    - cron: '30 1 * * *'   # 7:00 AM IST (01:30 UTC)
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Refresh data
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
        run: python refresh_data.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "chore: auto-refresh $(date +'%d-%m-%Y')"
            git push
          )
